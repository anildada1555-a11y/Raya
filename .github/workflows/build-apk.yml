name: Build Raya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Raya project
        run: |
          rm -rf raya-project
          mkdir raya-project
          unzip -o Raya-Android-Voice-Assistant.zip -d raya-project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Create Gradle version catalog
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)

          mkdir -p "$PROJECT_DIR/gradle"

          cat > "$PROJECT_DIR/gradle/libs.versions.toml" <<'EOF'
          [versions]
          agp = "8.7.3"
          kotlin = "1.9.24"

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          EOF

      - name: Enable AndroidX
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)

          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Create missing Android resources
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)
          RES="$PROJECT_DIR/app/src/main/res"

          mkdir -p "$RES/values"
          mkdir -p "$RES/mipmap"

          if ! grep -Rqs "name=\"Theme.RayaVoiceAssistant\"" "$RES"; then
            cat > "$RES/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.RayaVoiceAssistant" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#6750A4</item>
              </style>
          </resources>
          EOF
          fi

          if [ ! -f "$RES/mipmap/ic_launcher.xml" ]; then
            cat > "$RES/mipmap/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6750A4"
                  android:pathData="M54,8 A46,46 0,1 0,54 100 A46,46 0,1 0,54 8" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M42,38 L42,70 L72,54 Z" />
          </vector>
          EOF
          fi

          if [ ! -f "$RES/mipmap/ic_launcher_round.xml" ]; then
            cp "$RES/mipmap/ic_launcher.xml" "$RES/mipmap/ic_launcher_round.xml"
          fi

          echo "Android resources:"
          find "$RES" -maxdepth 2 -type f | sort

      - name: Build APK
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)
          cd "$PROJECT_DIR"

          echo "Building Raya..."
          gradle clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Raya-debug-APK
          path: raya-project/**/build/outputs/apk/**/*.apk
