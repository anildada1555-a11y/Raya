name: Build Raya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Raya project
        run: |
          rm -rf raya-project
          mkdir raya-project
          unzip -o Raya-Android-Voice-Assistant.zip -d raya-project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Show Gradle configuration
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)

          echo "===== ROOT BUILD ====="
          cat "$PROJECT_DIR/build.gradle.kts"

          echo "===== APP BUILD ====="
          cat "$PROJECT_DIR/app/build.gradle.kts"

          echo "===== SETTINGS ====="
          cat "$PROJECT_DIR/settings.gradle.kts"

          echo "===== LIBS REFERENCES ====="
          grep -R "libs\." -n "$PROJECT_DIR" --include="*.gradle.kts" || true

          echo "===== GRADLE FOLDER ====="
          find "$PROJECT_DIR/gradle" -maxdepth 2 -type f -print 2>/dev/null || true
               find "$PROJECT_DIR/gradle" -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Fix missing Gradle version catalog
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)

          mkdir -p "$PROJECT_DIR/gradle"

          cat > "$PROJECT_DIR/gradle/libs.versions.toml" <<'EOF'
          [versions]
          agp = "8.7.3"
          kotlin = "1.9.24"

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          EOF

          echo "Created:"
          cat "$PROJECT_DIR/gradle/libs.versions.toml"
      - name: Enable AndroidX
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
      - name: Build APK
        run: |
          PROJECT_DIR=$(find raya-project -name "settings.gradle.kts" -type f -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Raya-debug-APK
          path: raya-project/**/build/outputs/apk/**/*.apk
