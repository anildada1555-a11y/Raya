name: Build Raya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================
      # 2. JAVA 17
      # ==========================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. EXTRACT RAYA ZIP
      # ==========================================

      - name: Extract Raya project
        run: |
          set -e

          mkdir -p raya-project

          unzip -o "Raya-Android-Voice-Assistant.zip" -d raya-project

          echo "=========================================="
          echo "EXTRACTED FILES"
          echo "=========================================="

          find raya-project -maxdepth 6 -type f | sort


      # ==========================================
      # 4. FIND ANDROID PROJECT
      # ==========================================

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR=$(find raya-project \
            -name "settings.gradle.kts" \
            -type f \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo "$PROJECT_DIR"


      # ==========================================
      # 5. GRADLE 8.10
      # ==========================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'


      # ==========================================
      # 6. GRADLE VERSION CATALOG
      # ==========================================

      - name: Create Gradle version catalog
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/gradle"

          cat > "$PROJECT_DIR/gradle/libs.versions.toml" <<'EOF'
          [versions]
          agp = "8.7.3"
          kotlin = "1.9.24"

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          EOF

          echo "=========================================="
          echo "libs.versions.toml"
          echo "=========================================="

          cat "$PROJECT_DIR/gradle/libs.versions.toml"


      # ==========================================
      # 7. GRADLE PROPERTIES
      # ==========================================

      - name: Configure Gradle
        run: |
          set -e

          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true

          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

          org.gradle.parallel=false
          org.gradle.workers.max=2

          kotlin.daemon.jvmargs=-Xmx1024m
          EOF

          echo "=========================================="
          echo "gradle.properties"
          echo "=========================================="

          cat "$PROJECT_DIR/gradle.properties"


      # ==========================================
      # 8. FIX ANDROID MANIFEST
      # ==========================================

      - name: Fix AndroidManifest
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          sed -i 's/package="com\.raya\.assistant"//g' "$MANIFEST"

          echo "=========================================="
          echo "AndroidManifest.xml"
          echo "=========================================="

          cat "$MANIFEST"


      # ==========================================
      # 9. CREATE ANDROID RESOURCES
      # ==========================================

      - name: Create Android resources
        run: |
          set -e

          RES="$PROJECT_DIR/app/src/main/res"

          mkdir -p "$RES/values"
          mkdir -p "$RES/mipmap"


          # --------------------------------------
          # strings.xml
          # --------------------------------------

          cat > "$RES/values/strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">Raya</string>

              <string name="accessibility_service_summary">
                  Raya Accessibility Service
              </string>

              <string name="accessibility_service_desc">
                  Allows Raya to control Android apps using accessibility actions.
              </string>

          </resources>
          EOF


          # --------------------------------------
          # styles.xml
          # --------------------------------------

          cat > "$RES/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.RayaVoiceAssistant"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#6750A4</item>

              </style>

          </resources>
          EOF


          # --------------------------------------
          # launcher icon
          # --------------------------------------

          cat > "$RES/mipmap/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#6750A4"
                  android:pathData="M54,8 A46,46 0,1 0,54 100 A46,46 0,1 0,54 8" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M42,38 L42,70 L72,54 Z" />

          </vector>
          EOF


          cp "$RES/mipmap/ic_launcher.xml" \
             "$RES/mipmap/ic_launcher_round.xml"


          echo "=========================================="
          echo "ANDROID RESOURCES CREATED"
          echo "=========================================="

          find "$RES" -maxdepth 3 -type f | sort


      # ==========================================
      # 10. FIX JVM TARGET
      # ==========================================

      - name: Fix JVM target compatibility
        run: |
          set -e

          APP_BUILD="$PROJECT_DIR/app/build.gradle.kts"

          cat >> "$APP_BUILD" <<'EOF'

          // ==========================================
          // Raya JVM compatibility
          // ==========================================

          android {

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          }

          EOF

          echo "=========================================="
          echo "JVM CONFIGURATION"
          echo "=========================================="

          tail -60 "$APP_BUILD"


      # ==========================================
      # 11. FIX COMPOSE COMPILER
      # ==========================================

      - name: Fix Compose Compiler compatibility
        run: |
          set -e

          APP_BUILD="$PROJECT_DIR/app/build.gradle.kts"

          echo "=========================================="
          echo "SEARCHING COMPOSE COMPILER"
          echo "=========================================="

          grep -n \
            "kotlinCompilerExtensionVersion" \
            "$APP_BUILD" || true


          # Replace old Compose compiler version
          sed -i \
            's/kotlinCompilerExtensionVersion[[:space:]]*=[[:space:]]*"[^"]*"/kotlinCompilerExtensionVersion = "1.5.14"/g' \
            "$APP_BUILD"


          # Add Compose compiler configuration
          cat >> "$APP_BUILD" <<'EOF'

          // ==========================================
          // Raya Compose Compiler compatibility
          // Kotlin 1.9.24
          // Compose Compiler 1.5.14
          // ==========================================

          android {

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

          }

          EOF


          echo "=========================================="
          echo "COMPOSE COMPILER CONFIGURATION"
          echo "=========================================="

          grep -n \
            "kotlinCompilerExtensionVersion" \
            "$APP_BUILD" || true


      # ==========================================
      # 12. VERIFY PROJECT
      # ==========================================

      - name: Verify Android project
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT DIRECTORY"
          echo "=========================================="

          echo "$PROJECT_DIR"


          echo ""
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            | sort


          echo ""
          echo "=========================================="
          echo "SETTINGS.GRADLE.KTS"
          echo "=========================================="

          cat "$PROJECT_DIR/settings.gradle.kts"


          echo ""
          echo "=========================================="
          echo "APP BUILD.GRADLE.KTS"
          echo "=========================================="

          cat "$PROJECT_DIR/app/build.gradle.kts"


      # ==========================================
      # 13. BUILD APK
      # ==========================================

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version


          echo ""
          echo "=========================================="
          echo "BUILDING RAYA APK"
          echo "=========================================="


          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug


      # ==========================================
      # 14. CHECK APK
      # ==========================================

      - name: Check APK
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -print


          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name "*.apk" \
            -type f \
            -print -quit)


          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK WAS NOT CREATED"
            exit 1
          fi


          echo ""
          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="

          echo "$APK"


      # ==========================================
      # 15. UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Raya-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error              
