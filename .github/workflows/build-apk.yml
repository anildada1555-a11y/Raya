name: Build Raya APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract NEW Raya project
      - name: Extract new Raya project
        shell: bash
        run: |
          set -e

          rm -rf raya-project
          mkdir -p raya-project

          if [ ! -f "Raya-Android-Voice-Assistant-FULL-NEW.zip" ]; then
            echo "ERROR: New Raya ZIP not found"
            exit 1
          fi

          unzip -q "Raya-Android-Voice-Assistant-FULL-NEW.zip" -d raya-project

          echo "===== EXTRACTED FILES ====="
          find raya-project -maxdepth 8 -type f | sort

      # 4. Locate Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find raya-project \
            -name "settings.gradle.kts" \
            -type f \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find raya-project \
              -name "settings.gradle" \
              -type f \
              -print -quit | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            echo "Searching for Gradle files:"
            find raya-project -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "===== ANDROID PROJECT ====="
          echo "$PROJECT_DIR"

      # 5. Show project structure
      - name: Verify new project
        shell: bash
        run: |
          set -e

          echo "===== PROJECT FILES ====="
          find "$PROJECT_DIR" -maxdepth 6 -type f | sort

          echo "===== GRADLE FILES ====="
          ls -la "$PROJECT_DIR"

          if [ -d "$PROJECT_DIR/app" ]; then
            echo "APP MODULE FOUND"
          else
            echo "ERROR: app module not found"
            exit 1
          fi

      # 6. Gradle 8.10
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      # 7. Gradle memory
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      # 8. Build APK
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== BUILDING RAYA ====="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      # 9. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "===== APK FILES ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK FOUND:"
          echo "$APK"

      # 10. Upload APK
      - name: Upload Raya APK
        uses: actions/upload-artifact@v6
        with:
          name: Raya-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
